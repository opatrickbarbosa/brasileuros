<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Brasileuros · Gestão</title>
<link rel="icon" href="/assets/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#3772B4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function(){try{var t=localStorage.getItem("bxe-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<style>
:root{
  --bg:#f5f5f2;--panel:#ffffff;--panel2:#fafaf8;--line:#e3e3de;--line2:#d4d4ce;
  --text:#151515;--muted:#6a6a64;--faint:#9a9a93;
  --accent:#FDD929;--accent-ink:#0f1e3b;--accent-text:#2f63a8;--accent-soft:#fff6c7;--brand:#3772B4;--brand-soft:rgba(55,114,180,.14);
  --danger:#c8240d;--danger-soft:#fde7e3;--ok:#23824a;--ok-soft:#e1f3e7;
  --track:#ecece7;--shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1011;--panel:#17181a;--panel2:#1c1d20;--line:#2a2c2f;--line2:#36383c;
  --text:#f1f1ee;--muted:#a2a29c;--faint:#6f6f6a;
  --accent:#FDD929;--accent-ink:#0f1e3b;--accent-text:#8fb8ea;--accent-soft:#3a3410;--brand:#6fa3e0;--brand-soft:rgba(111,163,224,.18);
  --danger:#ff6a52;--danger-soft:#3b1a14;--ok:#7fd49a;--ok-soft:#183226;
  --track:#26282b;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1011;--panel:#17181a;--panel2:#1c1d20;--line:#2a2c2f;--line2:#36383c;
  --text:#f1f1ee;--muted:#a2a29c;--faint:#6f6f6a;
  --accent:#FDD929;--accent-ink:#0f1e3b;--accent-text:#8fb8ea;--accent-soft:#3a3410;--brand:#6fa3e0;--brand-soft:rgba(111,163,224,.18);
  --danger:#ff6a52;--danger-soft:#3b1a14;--ok:#7fd49a;--ok-soft:#183226;
  --track:#26282b;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:14px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1}.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--danger)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.chip.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{width:100%;height:36px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);outline:none}
textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
label.f>span{display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.done>i{background:var(--ok)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:100%;max-width:380px;padding:28px}
.logo{display:inline-flex;align-items:center;flex:0 0 auto;cursor:pointer;border:0;background:none;padding:0}
.logo img{height:36px;width:auto;display:block}
.logo .l-light{display:none}
:root[data-theme="dark"] .logo .l-light{display:block}:root[data-theme="dark"] .logo .l-ink{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .l-light{display:block}:root:not([data-theme="light"]) .logo .l-ink{display:none}}
.auth .logo img{height:64px}
.auth h1{margin:18px 0 4px}
.auth form{display:grid;gap:12px;margin-top:18px}
.msg{font-size:13px;padding:8px 10px;border-radius:8px}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
/* shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{height:32px;padding:0 12px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--text);background:var(--panel2)}
.nav button.on{color:var(--text);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.main{max-width:1280px;margin:0 auto;padding:20px 20px 80px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
/* timeline */
.tl{position:relative;display:flex;gap:14px;overflow-x:auto;padding:30px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:thin}
.tl-axis{position:absolute;left:0;top:14px;height:1px;background:var(--line2)}
.tl-today{position:relative;flex:0 0 28px;scroll-snap-align:start;display:flex;justify-content:center}
.tl-today:before{content:"";width:2px;border-radius:2px;background:var(--accent)}
.tl-today span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--accent-text);white-space:nowrap}
.sc{flex:0 0 248px;scroll-snap-align:start;cursor:pointer;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.sc:hover{border-color:var(--faint)}
.sc.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sc.past{opacity:.6}
.sc-date b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sc-date span{display:block;margin-top:2px}
.sc-title{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-rows{display:grid;gap:7px}
.sc-row{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;font-size:12.5px}
.sc-row em{font-style:normal;color:var(--faint);text-align:right;font-size:11.5px}
.sc-foot{display:flex;gap:6px;flex-wrap:wrap}
.tl-add{flex:0 0 140px;display:grid;place-items:center;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);cursor:pointer;background:transparent}
.tl-add:hover{color:var(--text);border-color:var(--faint)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column}
.day.today{border-color:var(--accent)}
.day-h{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;display:flex;justify-content:space-between}
.day-b{padding:8px;display:grid;gap:6px;align-content:start}
.task{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;background:var(--panel2);font-size:12.5px;line-height:1.35}
.task input{margin:2px 0 0;accent-color:var(--ok);width:15px;height:15px;flex:0 0 auto;cursor:pointer}
.task .t-sub{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.task.done .t-main{text-decoration:line-through;color:var(--faint)}
.task.late{background:var(--danger-soft)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
/* event */
.ev-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs button .chip{margin-left:6px;height:18px;padding:0 6px;font-size:11px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.list{display:grid;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px}
.kpi b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.sectors{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sector{padding:12px;cursor:pointer}
.sector:hover{border-color:var(--faint)}
.empty{padding:18px;text-align:center;color:var(--faint);font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:20px}
.modal form{display:grid;gap:12px;margin-top:14px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
@media (max-width:760px){
  .top-in{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .top-in .nav{order:3;width:100%}
  .main{padding:14px 14px 80px}
  .cols,.grid2{grid-template-columns:1fr}
  .sc{flex-basis:78vw}
  .week{grid-template-columns:repeat(7,78vw);scroll-snap-type:x mandatory}
  .day{scroll-snap-align:start}
  .hide-m{display:none}
}

/* ===== layout Instagram web ===== */
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn .ic{width:18px;height:18px}
.demo-bar{position:sticky;top:0;z-index:40;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;padding:8px 16px;display:flex;gap:10px;align-items:center;justify-content:center}
.ig{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:244px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:22px 12px 16px;z-index:30}
.has-demo .side{top:37px}
.side-logo{display:flex;align-items:center;height:56px;padding:0 12px;margin-bottom:18px}
.side-logo img{height:34px;width:auto}
.side-logo b{display:none;font:800 22px/1 Inter,sans-serif;color:var(--brand)}
.side-nav{display:grid;gap:4px}
.side-nav button,.side-more>button{display:flex;align-items:center;gap:16px;height:48px;padding:0 12px;border:0;background:none;border-radius:10px;cursor:pointer;font-size:16px;color:var(--text);text-align:left;width:100%}
.side-nav button:hover,.side-more>button:hover{background:var(--panel2)}
.side-nav button.on{font-weight:700}
.side-nav button.on .ic{stroke-width:2.6}
.side-more{margin-top:auto;position:relative}
.more-menu{position:absolute;left:0;bottom:56px;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:8px;display:grid;gap:2px;z-index:60}
.more-menu button{height:42px;border:0;background:none;text-align:left;padding:0 12px;border-radius:8px;cursor:pointer}
.more-menu button:hover{background:var(--panel2)}
.mm-who{padding:8px 12px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line);margin-bottom:4px}
.mtop,.tabbar{display:none}
.more-menu[hidden]{display:none}
.k-next>div{display:grid;gap:3px;min-width:0}
.hello p::first-letter,.rail-i b::first-letter,.k-v2::first-letter{text-transform:uppercase}
.ig .main{max-width:none;margin:0 0 0 244px;padding:28px 32px 80px}
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;max-width:1120px;margin:0 auto}
.home-main{min-width:0}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.hello h1{font-size:26px}
.hello p{margin:2px 0 0}
.stories{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:22px}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;display:grid;justify-items:center;gap:6px;border:0;background:none;cursor:pointer;width:76px;color:var(--text)}
.st-ring{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(#FDD929 0 var(--p,0%),#3772B4 var(--p,0%) 100%);display:grid}
.story.next .st-ring{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #FDD929}
.st-in{border-radius:50%;background:var(--panel);border:3px solid var(--panel);display:grid;place-items:center;align-content:center;line-height:1}
.st-in b{font-size:22px;font-weight:800}
.st-in small{font-size:11px;color:var(--muted);text-transform:uppercase}
.story.add .st-ring{background:var(--line2)}
.story.add .st-in{color:var(--muted)}
.st-l{font-size:11.5px;color:var(--muted);white-space:nowrap;text-transform:capitalize}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.k{padding:18px;display:flex;flex-direction:column;gap:4px;min-height:150px;position:relative;overflow:hidden}
.k-l{font-size:12.5px;color:var(--muted);font-weight:500}
.k-v{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.k-v small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.k-v2{font-size:22px;font-weight:800}
.k-s{font-size:12.5px;color:var(--muted)}
.k-s.up{color:var(--ok);font-weight:600}.k-s.down{color:var(--danger);font-weight:600}
.k-sales{background:linear-gradient(135deg,#3772B4,#25558f);color:#fff;border:0}
.k-sales .k-l,.k-sales .k-s,.k-sales .k-v small{color:rgba(255,255,255,.82)}
.k-sales .k-v{color:#FDD929;font-size:46px}
.k-next{flex-direction:row;align-items:center;gap:16px}
.ring-t{font:800 18px Inter,sans-serif;fill:var(--text)}
.spark{width:100%;height:40px;margin-top:auto}
.spark-empty{margin-top:auto}
.sec2{margin-top:18px}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:170px;padding-top:6px}
.bcol{display:grid;grid-template-rows:18px 1fr 18px;height:100%;text-align:center;font-size:11px;color:var(--muted)}
.bcol i{align-self:end;display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--brand)}
.bcol.now i{background:var(--accent)}
.bcol.now .bd{color:var(--text);font-weight:700}
.bq{font-weight:600;color:var(--text)}
.feed{display:grid;gap:12px}
.fi{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#0f1e3b;background:linear-gradient(135deg,#FDD929,#f2b705)}
.av.lg{width:52px;height:52px;font-size:16px;color:#fff;background:linear-gradient(135deg,#3772B4,#25558f)}
.fi-v{font-weight:600;white-space:nowrap}
.rail{position:sticky;top:28px;align-self:start;display:grid;gap:10px}
.me{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rail-h{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;margin-top:10px}
.link{border:0;background:none;color:var(--text);font-weight:600;cursor:pointer;font-size:12.5px;padding:0}
.rail-i{display:flex;gap:12px;align-items:center;border:0;background:none;text-align:left;cursor:pointer;padding:4px 0;color:var(--text)}
.rail-i b{font-size:13.5px;display:block}
.rd{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;align-content:center;line-height:1;background:var(--panel2);border:1px solid var(--line)}
.rd b{font-size:15px}.rd small{font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rail-links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.rail-links a{color:var(--muted);text-decoration:none}.rail-links a:hover{text-decoration:underline}
@media (max-width:1264px){
  .side{width:72px;padding:22px 10px 16px}
  .side-logo img{display:none}.side-logo b{display:block}
  .side-nav button span,.side-more>button span{display:none}
  .side-nav button,.side-more>button{justify-content:center;padding:0}
  .ig .main{margin-left:72px}
}
@media (max-width:1100px){.home{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
@media (max-width:767px){
  .side{display:none}
  .mtop{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:30;height:56px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .mtop img{height:28px}
  .demo-bar{position:static}
  .has-demo .mtop{top:0}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{height:54px;border:0;background:none;display:grid;place-items:center;color:var(--text);cursor:pointer}
  .tabbar button span{display:none}
  .tabbar button.on .ic{stroke-width:2.6}
  .ig .main{margin:0;padding:16px 14px 90px}
  .more-menu{position:fixed;right:12px;left:auto;top:58px;bottom:auto}
  .side-more{position:static}
  .kgrid{grid-template-columns:1fr 1fr;gap:10px}
  .k{padding:14px;min-height:130px}
  .k-v{font-size:30px}.k-sales .k-v{font-size:36px}
  .k-sales,.k-next{grid-column:1/-1}
  .bars{gap:3px;height:150px}
  .hello h1{font-size:22px}
}

/* funil cruzado */
.fsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:6px}
.fs{position:relative;display:grid;gap:3px;align-content:end;padding:10px 8px 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);min-height:190px}
.fs.worst{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.fs b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.fl{font-size:12px;font-weight:600;line-height:1.25}
.fsrc{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.fbar{height:70px;display:flex;align-items:flex-end}
.fbar i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#FDD929,#3772B4)}
.fr{position:absolute;top:8px;left:8px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.fr.bad{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.fr.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.tip{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:13.5px;line-height:1.45}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini span{display:grid;gap:2px;padding:10px;border-radius:10px;background:var(--panel2)}
.mini b{font-size:20px;font-weight:800}.mini small{font-size:11.5px;color:var(--muted)}
a.fi.post{color:var(--text);text-decoration:none}
.pcap{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.fi-v small{font-weight:500;color:var(--muted);font-size:11px}

/* período */
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:-4px 0 18px}
.pchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.pchips::-webkit-scrollbar{display:none}
.pchip{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:600;font-size:13px;color:var(--text)}
.pchip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pcustom{display:flex;align-items:center;gap:8px}
.pcustom input{width:150px;height:32px}
.k-per{margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,.18)}
.k-per b{color:#FDD929}
.flow.is-loading .fsteps{opacity:.45}

/* e-mail marketing */
.em{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.em-ed form{display:grid;gap:12px}
.em-imgs{display:flex;flex-wrap:wrap;gap:8px}
.em-img{width:64px;height:64px;border-radius:10px;border:2px solid var(--line);padding:0;overflow:hidden;background:var(--panel2);cursor:pointer;display:grid;place-items:center;font-weight:700;color:var(--muted)}
.em-img img{width:100%;height:100%;object-fit:cover;display:block}
.em-img.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.em-img.up{font-size:26px}
.em-prev{position:sticky;top:20px}
.em-phone{border:1px solid var(--line);border-radius:28px;background:var(--panel);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.em-mail-h{display:grid;gap:2px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px}
.em-mail-h span{font-weight:600}.em-mail-h small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#em-frame{width:100%;height:640px;border:0;background:#dfe9f5;display:block}
@media (max-width:1100px){.em{grid-template-columns:1fr}.em-prev{position:static}}

<body>
<div id="app"><div class="loading">Carregando...</div></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// Preencha com os dados do projeto Supabase do Brasileuros (Project Settings → API).
const SUPABASE_URL = "https://zgtigkuhfnizoerhsuvv.supabase.co";
const SUPABASE_KEY = "sb_publishable_qQcuRCRf-APrv9crOJGMnw_BIaaCdka";
const PARTNERS = ["Patrick", "Pipo"];
const SHARE = { Patrick: .5, Pipo: .5 };
const DEFAULT_CAPACITY = 50;      // lugares na La Chirigota: ajuste em cada show
const LINEUP_GOAL = 1;            // convidados do Barcelouca por show
const SHOW_DEFAULTS = { time: "19:30", title: "Brasileuros – Comédia do Nosso Jeitinho", venue: "Bar La Chirigota", status: "planned", capacity: DEFAULT_CAPACITY, cash_price: 7, bizum_price: 7, sponsor: 0, headliners: 2, headliner_fee: 0, guests: 1, guest_fee: 0 };
const DEFAULT_TEMPLATE = [
  { key: "eb", title: "Evento aberto no Eventbrite", sector: "Ingressos", offset: -14 },
  { key: "guest", title: "Fechar convidado(a) do Barcelouca", sector: "Show", offset: -6 },
  { key: "flyer", title: "Arte do show pronta", sector: "Instagram", offset: -7 },
  { key: "ad_live", title: "Anúncio rodando", sector: "Anuncios", offset: -6 },
  { key: "ig_post", title: "Post de humor com data e preço", sector: "Instagram", offset: -5 },
  { key: "wa", title: "Aviso na lista de WhatsApp", sector: "Ingressos", offset: -3 },
  { key: "st2", title: "Stories D-2 com link", sector: "Instagram", offset: -2 },
  { key: "st1", title: "Stories D-1 com link", sector: "Instagram", offset: -1 },
  { key: "st0", title: "Stories no dia + contagem", sector: "Instagram", offset: 0 },
  { key: "cash", title: "Fechar o caixa da noite", sector: "Financeiro", offset: 0 },
  { key: "clips", title: "Postar cortes do show", sector: "Instagram", offset: 2 },
  { key: "barcelouca", title: "Editar e postar o Barcelouca", sector: "Instagram", offset: 4 },
];
let DEMO = false;

// read the auth callback type before the client consumes the URL hash
const HASH = new URLSearchParams(location.hash.slice(1));
let AUTH_TYPE = HASH.get("type");            // invite | recovery | signup | magiclink
const AUTH_ERR = HASH.get("error_description");

const sb = SUPABASE_URL ? createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, detectSessionInUrl: true } }) : null;

/* ---------------- i18n ---------------- */
let LANG = localStorage.getItem("bxe-lang") || ((navigator.language || "").startsWith("pt") ? "pt" : "en");
const L = (pt, en) => LANG === "en" ? en : pt;
const SECTORS = [
  ["Show", "Show", "Show", "#ECC122"],
  ["Instagram", "Instagram", "Instagram", "#d4569b"],
  ["Anuncios", "Anúncios", "Ads", "#4c7bd9"],
  ["Cupons", "Cupons", "Coupons", "#2f9e8f"],
  ["Ingressos", "Ingressos", "Tickets", "#8a63d2"],
  ["Financeiro", "Financeiro", "Finance", "#5f8f3a"],
];
const SECTOR_NAME = k => { const s = SECTORS.find(x => x[0] === k); return s ? L(s[1], s[2]) : (k === "Patrocinio" ? L("Patrocínio", "Sponsor") : (k || "")); };
const SECTOR_COLOR = k => (SECTORS.find(x => x[0] === k) || [0, 0, 0, "#9a9a93"])[3];
const TASK_EN = { eb: "Eventbrite event open", guest: "Lock the Barcelouca guest", flyer: "Show artwork ready", ad_live: "Ad running", ig_post: "Funny post with date and price", wa: "WhatsApp list alert", st2: "Stories D-2 with link", st1: "Stories D-1 with link", st0: "Stories on the day + countdown", cash: "Close the night's cash", clips: "Post show clips", barcelouca: "Edit and post Barcelouca" };
const taskTitle = t => LANG === "en" && TASK_EN[t.template_key] ? TASK_EN[t.template_key] : t.title;

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const pd = s => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const fdate = (s, o) => s ? new Intl.DateTimeFormat(LANG === "en" ? "en-GB" : "pt-BR", o || { weekday: "short", day: "numeric", month: "short" }).format(pd(s)).replace(/\./g, "") : "";
const eur = v => new Intl.NumberFormat(LANG === "en" ? "en-GB" : "pt-BR", { style: "currency", currency: "EUR" }).format(num(v));
const daysTo = s => Math.round((pd(s) - pd(today())) / 864e5);
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/-/g, "").slice(0, 12);

/* ---------------- state ---------------- */
const TABLES = ["shows", "tasks", "lineup", "comedians", "coupons", "ads", "expenses", "payments", "instagram", "ig_stats", "orders", "signups", "settings", "profiles", "campaigns"];
let S = Object.fromEntries(TABLES.map(t => [t, []]));
let ME = null, PROFILE = null;
let R = { view: "home", showId: null, tab: "overview", weekStart: null, mine: false, period: (() => { try { return JSON.parse(localStorage.getItem("bxe-period")) || { k: "28d" }; } catch (e) { return { k: "28d" }; } })() };

async function loadAll() {
  const res = await Promise.all(TABLES.map(t => sb.from(t).select("*")));
  res.forEach((r, i) => { if (r.error) throw r.error; S[TABLES[i]] = r.data || []; });
  const ins = await sb.from("insights").select("*").order("at", { ascending: false }).limit(1);
  INS = ins.data?.[0] || null;
}
async function save(table, row) {
  if (DEMO) { const key = table === "settings" ? "key" : "id"; const i = S[table].findIndex(x => x[key] === row[key]); if (i >= 0) S[table][i] = row; else S[table].push(row); return row; }
  const { data, error } = await sb.from(table).upsert(row).select().single();
  if (error) { toast(L("Erro ao salvar: ", "Save error: ") + error.message); throw error; }
  const key = table === "settings" ? "key" : "id";
  const i = S[table].findIndex(x => x[key] === data[key]);
  if (i >= 0) S[table][i] = data; else S[table].push(data);
  return data;
}
async function del(table, id) {
  if (DEMO) { S[table] = S[table].filter(x => x.id !== id); return; }
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) { toast(error.message); throw error; }
  S[table] = S[table].filter(x => x.id !== id);
}
async function ebCall(body) {
  const { data, error } = await sb.functions.invoke("eventbrite", { body });
  if (error) { let msg = error.message; try { const j = await error.context.json(); msg = j.error || msg; } catch (e) {} throw new Error(msg); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function refresh(table) { if (DEMO) return; const { data } = await sb.from(table).select("*"); if (data) S[table] = data; }
async function pushCoupon(c) {
  if (!c || c.eb_discount_id === "manual") return;
  try { const r = await ebCall({ action: "push_coupon", id: c.id }); await refresh("coupons"); toast(L("Cupom ", "Coupon ") + c.code + L(" criado no Eventbrite (", " is on Eventbrite (") + r.events + L(" evento", " event") + (r.events > 1 ? "s" : "") + ")"); }
  catch (e) { toast("Eventbrite: " + e.message); }
}
function logAct(action, detail) { if (DEMO) return; sb.from("activity_log").insert({ action, detail }).then(() => {}); }

/* ---------------- derived ---------------- */
const shows = () => S.shows.slice().sort((a, b) => a.date.localeCompare(b.date));
const showById = id => S.shows.find(s => s.id === id);
const tasksOf = id => S.tasks.filter(t => t.show_id === id).sort((a, b) => (a.due || "").localeCompare(b.due || ""));
const lineupOf = id => S.lineup.filter(l => l.show_id === id);
const booked = l => /confirm|paid|pago/i.test(l.payment || "");
const income = s => num(s.cash_tickets) * num(s.cash_price) + num(s.bizum_tickets) * num(s.bizum_price) + num(s.eb_net);
const fees = s => num(s.headliners) * num(s.headliner_fee) + num(s.guests) * num(s.guest_fee);
const sponsorIn = s => s.sponsor_paid ? num(s.sponsor) : 0;
const net = s => income(s) + sponsorIn(s) - fees(s);
const tickets = s => num(s.eb_tickets) + num(s.cash_tickets) + num(s.bizum_tickets) + num(s.free_tickets);
const template = () => (S.settings.find(x => x.key === "task_template") || {}).value || DEFAULT_TEMPLATE;
const nextShow = () => shows().find(s => s.date >= today() && s.status !== "cancelled");
function progress(showId, sector) {
  const ts = tasksOf(showId).filter(t => !sector || t.sector === sector);
  return { done: ts.filter(t => t.done).length, total: ts.length };
}
function finance() {
  const P = {}; PARTNERS.forEach(p => P[p] = { paid: 0, kept: 0, held: 0, out: 0, in: 0 });
  let shared = 0, profit = 0;
  S.expenses.forEach(e => { const a = num(e.amount); if (P[e.paid_by]) P[e.paid_by].paid += a; if (P[e.keeper]) P[e.keeper].kept += a; else shared += a; });
  shows().forEach(s => { if (s.date > today() && !income(s)) return; const n = net(s); if (P[s.held_by]) { P[s.held_by].held += n; profit += n; } });
  S.payments.forEach(t => { const a = num(t.amount); if (P[t.from_person]) P[t.from_person].out += a; if (P[t.to_person]) P[t.to_person].in += a; });
  PARTNERS.forEach(p => { const x = P[p]; x.bal = x.paid - x.kept - shared * SHARE[p] + (profit * SHARE[p] - x.held) + x.out - x.in; });
  const pending = shows().filter(s => s.date <= today() && s.status !== "cancelled").reduce((a, s) => a + (s.sponsor_paid ? 0 : num(s.sponsor)), 0);
  const totIncome = shows().reduce((a, s) => a + income(s) + sponsorIn(s), 0), totFees = shows().reduce((a, s) => a + fees(s), 0), totExp = S.expenses.reduce((a, e) => a + num(e.amount), 0);
  return { P, shared, profit, pending, totIncome, totFees, totExp };
}

/* ---------------- auth screens ---------------- */
const LOGO = `<span class="logo"><img src="/assets/logo.webp" alt="Brasileuros"></span>`;
function authShell(inner) {
  return `<div class="auth"><div class="card">${LOGO}${inner}</div></div>`;
}
function viewLogin(note) {
  $("#app").innerHTML = authShell(`
    <h1>${L("Entrar", "Sign in")}</h1>
    <p class="muted small">${L("Painel de gestão do Brasileuros", "Brasileuros management hub")}</p>
    <form id="f">
      ${note ? `<div class="msg ${note.ok ? "ok" : "err"}">${esc(note.text)}</div>` : ""}
      <label class="f"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="f"><span>${L("Senha", "Password")}</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn primary" style="justify-content:center">${L("Entrar", "Sign in")}</button>
      <button type="button" class="btn ghost" id="forgot" style="justify-content:center">${L("Esqueci a senha", "Forgot password")}</button>
    </form>
    <div class="row" style="margin-top:14px;justify-content:center">${langBtn()}</div>`);
  $("#f").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target), b = e.target.querySelector(".primary"); b.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: f.get("email").trim(), password: f.get("password") });
    if (error) { b.disabled = false; viewLogin({ text: /invalid/i.test(error.message) ? L("E-mail ou senha incorretos.", "Wrong e-mail or password.") : error.message }); }
  };
  $("#forgot").onclick = viewForgot; wireLang();
}
function viewForgot() {
  $("#app").innerHTML = authShell(`
    <h1>${L("Redefinir senha", "Reset password")}</h1>
    <p class="muted small">${L("Enviamos um link para o seu e-mail.", "We will e-mail you a link.")}</p>
    <form id="f">
      <label class="f"><span>E-mail</span><input type="email" name="email" required></label>
      <button class="btn primary" style="justify-content:center">${L("Enviar link", "Send link")}</button>
      <button type="button" class="btn ghost" id="back" style="justify-content:center">${L("Voltar", "Back")}</button>
    </form>`);
  $("#back").onclick = () => viewLogin();
  $("#f").onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector(".primary"); b.disabled = true;
    const { error } = await sb.auth.resetPasswordForEmail(new FormData(e.target).get("email").trim(), { redirectTo: location.origin + "/admin" });
    viewLogin(error ? { text: error.message } : { ok: true, text: L("Se o e-mail tiver conta, o link chega em instantes. Vale 1 hora.", "If the e-mail has an account, the link arrives shortly. It is valid for 1 hour.") });
  };
}
function viewSetPassword(isInvite) {
  $("#app").innerHTML = authShell(`
    <h1>${isInvite ? L("Criar sua senha", "Create your password") : L("Nova senha", "New password")}</h1>
    <p class="muted small">${esc(ME?.email || "")}</p>
    <form id="f">
      ${isInvite ? `<label class="f"><span>${L("Seu nome", "Your name")}</span><input type="text" name="name" value="${esc(PROFILE?.name || "")}" required></label>` : ""}
      <label class="f"><span>${L("Senha (mínimo 10 caracteres)", "Password (at least 10 characters)")}</span><input type="password" name="p1" minlength="10" autocomplete="new-password" required></label>
      <label class="f"><span>${L("Repita a senha", "Repeat password")}</span><input type="password" name="p2" minlength="10" autocomplete="new-password" required></label>
      <div id="err"></div>
      <button class="btn primary" style="justify-content:center">${L("Salvar e entrar", "Save and continue")}</button>
    </form>`);
  $("#f").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    if (f.get("p1") !== f.get("p2")) { $("#err").innerHTML = `<div class="msg err">${L("As senhas não são iguais.", "Passwords do not match.")}</div>`; return; }
    const b = e.target.querySelector(".primary"); b.disabled = true;
    const { error } = await sb.auth.updateUser({ password: f.get("p1") });
    if (error) { b.disabled = false; $("#err").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    if (isInvite && f.get("name")) { await sb.from("profiles").update({ name: f.get("name").trim() }).eq("id", ME.id); }
    AUTH_TYPE = null; history.replaceState(null, "", location.pathname); logAct(isInvite ? "password_created" : "password_reset");
    await boot();
  };
}
const langBtn = () => `<button class="btn ghost sm" data-lang>${LANG === "en" ? "PT" : "EN"}</button>`;
function wireLang() { document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { LANG = LANG === "en" ? "pt" : "en"; localStorage.setItem("bxe-lang", LANG); PROFILE ? render() : (sb ? viewLogin() : viewSetup()); }); }

/* ---------------- shell (layout do Instagram no navegador) ---------------- */
const IC = {
  home: '<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  shows: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  publico: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.1 4.5 1.8 5 4.9"/>',
  fin: '<path d="M17 6.5A7 7 0 1 0 17 17.5M4 10h9M4 14h9"/>',
  team: '<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/>',
  plus: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
  more: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  email: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/>',
  sync: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/>',
};
const icon = (k, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[k] || ""}</svg>`;
const NAV = [["home", "Início", "Home"], ["shows", "Shows", "Shows"], ["publico", "Público", "Audience"], ["email", "E-mail", "Email"], ["fin", "Financeiro", "Finance"], ["team", "Equipe", "Team"]];
function themeIcon() { const t = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); return t === "dark" ? L("Tema claro", "Light theme") : L("Tema escuro", "Dark theme"); }
function render() {
  const main = { home: vHome, shows: vShows, show: vShow, fin: vFin, publico: vCoupons, email: vEmail, team: vTeam }[R.view] || vHome;
  const on = k => R.view === k || (k === "shows" && R.view === "show");
  const navBtn = ([k, pt, en]) => `<button data-nav="${k}" class="${on(k) ? "on" : ""}" aria-label="${L(pt, en)}">${icon(k)}<span>${L(pt, en)}</span></button>`;
  $("#app").innerHTML = `
  ${DEMO ? `<div class="demo-bar">${L("Modo demonstração: números de exemplo, não são vendas reais.", "Demo mode: sample numbers, not real sales.")} <button class="btn sm" id="demo-off">${L("Sair", "Exit")}</button></div>` : ""}
  <div class="ig ${DEMO ? "has-demo" : ""}">
    <aside class="side">
      <a class="side-logo" href="#home" id="homelogo" aria-label="Brasileuros"><img src="/assets/logo.webp" alt="Brasileuros"><b>B€</b></a>
      <nav class="side-nav">${NAV.map(navBtn).join("")}
        <button id="newshow-side" aria-label="${L("Novo show", "New show")}">${icon("plus")}<span>${L("Novo show", "New show")}</span></button>
      </nav>
      <div class="side-more">

const PERIODS = () => [["7d", L("7 dias", "7 days")], ["week", L("Semana", "Week")], ["28d", L("28 dias", "28 days")], ["month", L("Mês", "Month")], ["3m", L("3 meses", "3 months")], ["6m", L("6 meses", "6 months")], ["year", L("Ano", "Year")], ["custom", L("Escolher", "Custom")]];
function periodRange() {

function periodIns() {

    { k: "bizum_tickets", l: L("Bizum (qtd)", "Bizum (qty)"), t: "number" }, { k: "bizum_price", l: L("Preço Bizum (€)", "Bizum price (€)"), t: "number" },
    { k: "free_tickets", l: L("Cortesias", "Free"), t: "number" }, { k: "eb_url", l: L("Link do Eventbrite", "Eventbrite link"), t: "url" },

    { k: "headliners", l: L("Comediantes da casa", "Resident comedians"), t: "number" }, { k: "headliner_fee", l: L("Cachê por comediante (€)", "Fee per comedian (€)"), t: "number" },
    { k: "guests", l: L("Convidados Barcelouca", "Barcelouca guests"), t: "number" }, { k: "guest_fee", l: L("Cachê convidado (€)", "Guest fee (€)"), t: "number" },

/* ---------------- coupons & audience ---------------- */
function editCoupon(c, showId) {
  modal(c ? L("Editar cupom", "Edit coupon") : L("Novo cupom", "New coupon"), [
    { k: "code", l: L("Código", "Code"), req: true }, { k: "percent", l: L("Desconto (%)", "Discount (%)"), t: "number" },
    { k: "scope", l: L("Validade", "Scope"), full: true },
    { k: "usage_limit", l: L("Limite de usos", "Usage limit"), t: "number" }, { k: "uses", l: L("Usos", "Uses"), t: "number" },
    { k: "status", l: "Status", t: "select", o: [["Active", L("Ativo", "Active")], ["Pending", L("Pendente", "Pending")], ["Review", L("Revisar", "Review")], ["Inactive", L("Inativo", "Inactive")]] },
    { k: "notes", l: L("Notas", "Notes"), t: "area" },
  ], c || { status: "Active", percent: 10, show_id: showId || null }, async row => {
    row.id = row.id || "c" + uid(); row.code = String(row.code).trim().toUpperCase();
    const saved = await save("coupons", row);
    if (saved.status !== "Inactive") await pushCoupon(saved);
  }, c ? async () => {
    if (c.eb_discount_id && c.eb_discount_id !== "manual") { try { await ebCall({ action: "delete_coupon", eb_discount_id: c.eb_discount_id }); } catch (e) { toast("Eventbrite: " + e.message); } }
    await del("coupons", c.id);
  } : null);
}
function buyers() {
  const m = new Map();
  S.orders.forEach(o => { const k = String(o.email || o.buyer_name || o.id).toLowerCase(); const x = m.get(k) || { name: o.buyer_name, email: o.email, shows: new Set(), qty: 0, net: 0, last: "" }; x.shows.add(o.show_id); x.qty += num(o.quantity); x.net += num(o.net); if ((o.created_at || "") > x.last) x.last = o.created_at || ""; m.set(k, x); });
  return [...m.values()].sort((a, b) => b.shows.size - a.shows.size || b.last.localeCompare(a.last));
}
function vCoupons() {
  const ss = S.signups.slice().sort((a, b) => b.created_at.localeCompare(a.created_at));
  const bs = buyers(), back = bs.filter(b => b.shows.size > 1);
  return `<div class="row wrap"><h1 class="grow">${L("Público", "Audience")}</h1><button class="btn primary" id="addcoupon">+ ${L("Cupom", "Coupon")}</button></div>
  <div class="kpis sec">
    <div class="card kpi"><span class="muted small">${L("Compradores", "Buyers")}</span><b>${bs.length}</b></div>
    <div class="card kpi"><span class="muted small">${L("Voltaram mais de uma vez", "Came back")}</span><b>${back.length}</b><span class="faint small">${bs.length ? Math.round(back.length / bs.length * 100) : 0}%</span></div>
    <div class="card kpi"><span class="muted small">${L("Ingressos vendidos", "Tickets sold")}</span><b>${sum(S.orders, o => o.quantity)}</b></div>
    <div class="card kpi"><span class="muted small">${L("Cadastros no site", "Site sign-ups")}</span><b>${ss.length}</b></div>
  </div>
  <div class="sec"><div class="sec-h"><h2 class="grow">${L("Quem compra", "Who buys")}</h2><button class="btn sm" id="copybuyers">${L("Copiar e-mails", "Copy e-mails")}</button></div>
  <div class="card pad"><div class="tablewrap"><table><tr><th>${L("Nome", "Name")}</th><th>E-mail</th><th class="num">Shows</th><th class="num">${L("Ingressos", "Tickets")}</th><th class="num">${L("Líquido", "Net")}</th><th>${L("Última compra", "Last purchase")}</th></tr>${bs.map(b => `<tr><td><b>${esc(b.name || "")}</b>${b.shows.size > 1 ? ` <span class="chip ok">${L("fiel", "regular")}</span>` : ""}</td><td>${esc(b.email || "")}</td><td class="num">${b.shows.size}</td><td class="num">${b.qty}</td><td class="num">${eur(b.net)}</td><td>${b.last ? fdate(madrid(b.last), { day: "numeric", month: "short" }) : ""}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">${L("As vendas aparecem aqui depois da primeira sincronização com o Eventbrite.", "Sales show up here after the first Eventbrite sync.")}</td></tr>`}</table></div></div></div>
  <div class="sec"><div class="sec-h"><h2 class="grow">${L("Cupons", "Coupons")}</h2></div><div class="card pad">${couponRows(S.coupons.slice().sort((a, b) => a.code.localeCompare(b.code)))}</div></div>
  <div class="sec"><div class="sec-h"><h2 class="grow">${L("Cadastros do site", "Site sign-ups")} (${ss.length})</h2><button class="btn sm" id="copyemails">${L("Copiar e-mails", "Copy e-mails")}</button></div>
  <div class="card pad"><div class="tablewrap"><table><tr><th>${L("Data", "Date")}</th><th>${L("Nome", "Name")}</th><th>E-mail</th><th>${L("Idioma", "Lang")}</th><th>${L("Cupom", "Coupon")}</th></tr>${ss.map(x => `<tr><td>${fdate(x.created_at.slice(0, 10), { day: "numeric", month: "short" })}</td><td>${esc(x.name || "")}</td><td>${esc(x.email)}</td><td>${esc(x.lang || "")}</td><td>${esc(x.coupon || "")}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">—</td></tr>`}</table></div></div></div>`;
}
function wireCoupons() {
  $("#addcoupon").onclick = () => editCoupon(null);
  document.querySelectorAll("[data-coupon]").forEach(b => b.onclick = () => editCoupon(S.coupons.find(c => c.id === b.dataset.coupon)));
  $("#copybuyers").onclick = () => { navigator.clipboard.writeText(buyers().map(b => b.email).filter(Boolean).join(", ")); toast(L("E-mails copiados", "E-mails copied")); };
  $("#copyemails").onclick = () => { navigator.clipboard.writeText(S.signups.filter(x => !x.unsubscribed).map(x => x.email).join(", ")); toast(L("E-mails copiados", "E-mails copied")); };
}

/* ---------------- finance ---------------- */
function vFin() {

  const exps = S.expenses.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const past = shows().filter(s => s.date <= today() || income(s));
  return `<div class="row wrap"><h1 class="grow">${L("Financeiro", "Finance")}</h1><button class="btn" id="addpay">+ ${L("Transferência", "Transfer")}</button><button class="btn primary" id="addexp">+ ${L("Despesa", "Expense")}</button></div>
  <div class="kpis sec">
    <div class="card kpi"><span class="muted small">${L("Receita total", "Total income")}</span><b>${eur(F.totIncome)}</b></div>
    <div class="card kpi"><span class="muted small">${L("Cachês", "Fees")}</span><b>${eur(F.totFees)}</b></div>
    <div class="card kpi"><span class="muted small">${L("Despesas", "Expenses")}</span><b>${eur(F.totExp)}</b></div>
    <div class="card kpi"><span class="muted small">${L("Patrocínio a receber", "Sponsorship owed")}</span><b>${eur(F.pending)}</b></div>
  </div>
  <div class="card pad sec"><h2>${L("Acerto entre sócios", "Partner settlement")}</h2>
    <p style="font-size:16px;margin:10px 0 14px">${pay && rec ? `<b>${pay}</b> ${L("deve", "owes")} <b>${rec}</b> <b style="color:var(--accent-text)">${eur(Math.abs(F.P[pay].bal))}</b>` : L("Contas zeradas.", "All square.")}</p>
    <div class="tablewrap"><table><tr><th></th>${PARTNERS.map(p => `<th class="num">${p}</th>`).join("")}</tr>
      <tr><td class="muted">${L("Pagou em despesas", "Paid in expenses")}</td>${PARTNERS.map(p => `<td class="num">${eur(F.P[p].paid)}</td>`).join("")}</tr>
      <tr><td class="muted">${L("Itens que ficaram com ele", "Items they kept")}</td>${PARTNERS.map(p => `<td class="num">${eur(F.P[p].kept)}</td>`).join("")}</tr>
      <tr><td class="muted">${L("Dinheiro de shows com ele", "Show money held")}</td>${PARTNERS.map(p => `<td class="num">${eur(F.P[p].held)}</td>`).join("")}</tr>
      <tr><td class="muted">${L("Transferências enviadas / recebidas", "Transfers sent / received")}</td>${PARTNERS.map(p => `<td class="num">${eur(F.P[p].out)} / ${eur(F.P[p].in)}</td>`).join("")}</tr>
      <tr><td><b>${L("Saldo", "Balance")}</b></td>${PARTNERS.map(p => `<td class="num"><b>${eur(F.P[p].bal)}</b></td>`).join("")}</tr></table></div>
    <p class="faint small" style="margin:10px 0 0">${L("Divisão 50/50, sem fundo de caixa. Patrocínio só entra quando pago.", "50/50 split, no cash fund. Sponsorship only counts once paid.")}</p></div>
  <div class="cols sec">
    <div class="card pad"><h2 style="margin-bottom:10px">${L("Shows", "Shows")}</h2><div class="tablewrap"><table><tr><th>${L("Data", "Date")}</th><th class="num">${L("Receita", "Income")}</th><th class="num">${L("Cachês", "Fees")}</th><th class="num">${L("Resultado", "Result")}</th></tr>${past.map(s => `<tr data-open="${s.id}" style="cursor:pointer"><td>${fdate(s.date, { day: "numeric", month: "short", year: "2-digit" })}</td><td class="num">${eur(income(s) + sponsorIn(s))}</td><td class="num">${eur(fees(s))}</td><td class="num"><b>${eur(net(s))}</b></td></tr>`).join("")}</table></div></div>
    <div class="card pad"><h2 style="margin-bottom:10px">${L("Despesas", "Expenses")}</h2><div class="tablewrap"><table><tr><th>${L("Item", "Item")}</th><th>${L("Pagou", "Paid by")}</th><th class="num">${L("Valor", "Amount")}</th><th></th></tr>${exps.map(e => `<tr><td>${esc(e.item)}${e.keeper && e.keeper !== "Shared" ? `<div class="faint small">${L("Fica com ", "Kept by ")}${esc(e.keeper)}</div>` : ""}</td><td>${esc(e.paid_by || "")}</td><td class="num">${eur(e.amount)}</td><td class="num"><button class="btn ghost sm" data-exp="${e.id}">${L("Editar", "Edit")}</button></td></tr>`).join("")}</table></div>
    ${S.payments.length ? `<h3 style="margin:16px 0 8px">${L("Transferências", "Transfers")}</h3><table>${S.payments.map(p => `<tr><td>${fdate(p.date)}</td><td>${esc(p.from_person)} → ${esc(p.to_person)}</td><td class="num">${eur(p.amount)}</td><td class="num"><button class="btn ghost sm" data-paym="${p.id}">${L("Editar", "Edit")}</button></td></tr>`).join("")}</table>` : ""}</div>

function wireFin() {

    { k: "paid_by", l: L("Quem pagou", "Paid by"), t: "select", o: PARTNERS }, { k: "keeper", l: L("Fica com", "Kept by"), t: "select", o: [["Shared", L("Dos dois", "Shared")], ...PARTNERS.map(p => [p, p])] },

  const payF = [{ k: "date", l: L("Data", "Date"), t: "date" }, { k: "amount", l: L("Valor (€)", "Amount (€)"), t: "number", req: true }, { k: "from_person", l: L("De", "From"), t: "select", o: PARTNERS }, { k: "to_person", l: L("Para", "To"), t: "select", o: PARTNERS.slice().reverse() }, { k: "notes", l: L("Notas", "Notes"), t: "area" }];
  $("#addexp").onclick = () => modal(L("Nova despesa", "New expense"), expF, { date: today(), paid_by: PROFILE?.name, keeper: "Shared", category: "Equipment" }, async r => { r.id = "e" + uid(); await save("expenses", r); });
  document.querySelectorAll("[data-exp]").forEach(b => b.onclick = () => { const e = S.expenses.find(x => x.id === b.dataset.exp); modal(L("Editar despesa", "Edit expense"), expF, e, r => save("expenses", r), async () => del("expenses", e.id)); });
  $("#addpay").onclick = () => modal(L("Nova transferência", "New transfer"), payF, { date: today() }, async r => { r.id = "t" + uid(); await save("payments", r); });
  document.querySelectorAll("[data-paym]").forEach(b => b.onclick = () => { const p = S.payments.find(x => x.id === b.dataset.paym); modal(L("Editar transferência", "Edit transfer"), payF, p, r => save("payments", r), async () => del("payments", p.id)); });

}

/* ---------------- team ---------------- */
const ROLES = () => [["admin", "Admin"], ["producao", L("Produção", "Production")], ["social", "Social media"]];
function vTeam() {
  const isAdmin = PROFILE?.role === "admin";
  return `<div class="row wrap"><h1 class="grow">${L("Equipe", "Team")}</h1>${isAdmin ? `<button class="btn primary" id="invite">+ ${L("Convidar pessoa", "Invite someone")}</button>` : ""}</div>
  <div class="card pad sec"><div class="tablewrap"><table><tr><th>${L("Nome", "Name")}</th><th>E-mail</th><th>${L("Papel", "Role")}</th><th>Status</th><th></th></tr>
  ${S.profiles.map(p => `<tr><td><b>${esc(p.name)}</b>${p.id === ME.id ? ` <span class="chip">${L("você", "you")}</span>` : ""}</td><td>${esc(p.email)}</td><td>${esc((ROLES().find(r => r[0] === p.role) || [0, p.role])[1])}</td><td><span class="chip ${p.active ? "ok" : "bad"}">${p.active ? L("Ativo", "Active") : L("Desativado", "Disabled")}</span></td><td class="num">${isAdmin && p.id !== ME.id ? `<button class="btn ghost sm" data-prof="${p.id}">${L("Editar", "Edit")}</button>` : ""}</td></tr>`).join("")}</table></div>
  <p class="faint small" style="margin:12px 0 0">${L("O convite chega por e-mail com um link para a pessoa criar a própria senha. Comediantes e convidados não têm acesso ao painel.", "The invite arrives by e-mail with a link to create a password. Comedians have no access to the hub.")}</p></div>`;
}
function wireTeam() {
  const inv = $("#invite"); if (inv) inv.onclick = () => modal(L("Convidar pessoa", "Invite someone"), [
    { k: "name", l: L("Nome", "Name"), req: true }, { k: "email", l: "E-mail", t: "email", req: true }, { k: "role", l: L("Papel", "Role"), t: "select", o: ROLES() },
  ], { role: "admin" }, async r => {
    if (DEMO) throw new Error(L("Na demonstração não dá para convidar.", "Invites are off in demo mode."));

    { k: "name", l: L("Nome", "Name"), req: true }, { k: "role", l: L("Papel", "Role"), t: "select", o: ROLES() }, { k: "active", l: L("Acesso ativo", "Access active"), t: "check" },
  ], p, r => save("profiles", { id: r.id, name: r.name, role: r.role, active: r.active, email: r.email, lang: r.lang })); });
}

/* ---------------- boot ---------------- */
function readHashRoute() {
  const h = location.hash.slice(1); if (!h || h.includes("access_token") || h.includes("error")) return;
  const [v, id, tab] = h.split("/");
  if (v === "show" && id) R = { ...R, view: "show", showId: id, tab: tab || "overview" }; else if (NAV.some(n => n[0] === v)) R.view = v; else if (v === "coupons") R.view = "publico";
}
function viewSetup() {
  $("#app").innerHTML = authShell(`
    <h1>${L("Painel ainda não conectado", "Hub not connected yet")}</h1>
    <p class="muted small">${L("Falta ligar o banco de dados (Supabase) do Brasileuros. Enquanto isso, veja como o painel fica com números de exemplo.", "The Brasileuros database (Supabase) is not linked yet. Meanwhile, see the hub with sample numbers.")}</p>
    <div style="display:grid;gap:10px;margin-top:18px"><button class="btn primary" id="demo" style="justify-content:center">${L("Ver demonstração", "See demo")}</button></div>
    <div class="row" style="margin-top:14px;justify-content:center">${langBtn()}</div>`);
  $("#demo").onclick = enterDemo; wireLang();
}
async function boot() {
  if (!sb) { if (location.search.includes("demo")) enterDemo(); else viewSetup(); return; }
  const { data: { session } } = await sb.auth.getSession();
  ME = session?.user || null;
  if (!ME) { viewLogin(AUTH_ERR ? { text: /expired|invalid/i.test(AUTH_ERR) ? L("Este link expirou ou já foi usado. Peça um novo.", "This link has expired or was already used. Ask for a new one.") : AUTH_ERR } : null); return; }
  const { data: prof } = await sb.from("profiles").select("*").eq("id", ME.id).maybeSingle();
  PROFILE = prof;
  if (!PROFILE || !PROFILE.active) { await sb.auth.signOut(); PROFILE = null; viewLogin({ text: L("Seu acesso está desativado. Fale com um admin.", "Your access is disabled. Talk to an admin.") }); return; }
  if (AUTH_TYPE === "invite" || AUTH_TYPE === "recovery") { viewSetPassword(AUTH_TYPE === "invite"); return; }
  $("#app").innerHTML = `<div class="loading">${L("Carregando...", "Loading...")}</div>`;
  try { await loadAll(); } catch (e) { $("#app").innerHTML = `<div class="loading">${esc(e.message)}</div>`; return; }
  readHashRoute(); render();
}
if (sb) sb.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") { AUTH_TYPE = "recovery"; } if (ev === "SIGNED_IN" && !PROFILE) setTimeout(boot, 0); });
boot();
</script>
